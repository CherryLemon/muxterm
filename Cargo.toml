[workspace]
resolver = "2"
members = [
    "crates/tmux-protocol",
    "crates/tmux-client",
    "crates/term-core",
    "crates/poc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# alacritty_terminal 0.26 (edition 2024) requires Rust 1.85.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/CherryLemon/muxterm"
description = "Muxterm: a cross-platform terminal where tmux windows are tabs and panes are splits"

[workspace.dependencies]
tmux-protocol = { path = "crates/tmux-protocol" }
tmux-client = { path = "crates/tmux-client" }
term-core = { path = "crates/term-core" }

[profile.release]
lto = "thin"
codegen-units = 1